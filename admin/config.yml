  - name: projects
    label: المشاريع
    file: content/projects.json
    fields:
    - name: items
      label: المشاريع
      label_singular: مشروع
      widget: list
      summary: '{{fields.title_ar}} — {{fields.year}}'
      hint: اسحب المشاريع لتغيير ترتيبها. إذا حذفت كلها يختفي القسم من الموقع.
      fields:
      - name: title_ar
        label: اسم المشروع (عربي)
        widget: string
      - name: title_en
        label: اسم المشروع (English)
        widget: string
      - name: category_ar
        label: نوع العمل (عربي)
        widget: string
        hint: 'مثل: هوية بصرية وموقع'
      - name: category_en
        label: نوع العمل (English)
        widget: string
      - name: year
        label: السنة
        widget: string
        required: false
      - name: summary_ar
        label: وصف قصير (عربي)
        widget: text
        required: false
      - name: summary_en
        label: وصف قصير (English)
        widget: text
        required: false
      - name: status
        label: حالة المشروع
        widget: select
        default: live
        hint: 'منشور: يظهر رابط «زيارة المشروع» (يحتاج رابطاً). قريباً أو مغلق: يظهر وسم بدل الرابط.'
        options:
        - label: منشور (يظهر الرابط)
          value: live
        - label: قريباً
          value: soon
        - label: مغلق
          value: closed
      - name: url
        label: رابط المشروع
        widget: string
        hint: يُستخدم فقط إذا كانت الحالة «منشور»
        required: false
      - name: image
        label: الصورة
        widget: image
        hint: صورة الغلاف أو الشعار. يفضّل عرضها 1600 بكسل أو أقل
        required: false
      - name: image_fit
        label: طريقة عرض الصورة
        widget: select
        hint: 'غلاف: تملأ المساحة. شعار: تظهر كاملة في الوسط على لون الخلفية'
        options:
        - label: غلاف (تملأ المساحة)
          value: cover
        - label: شعار (كاملة في الوسط)
          value: contain
        default: cover
      - name: image_bg
        label: لون خلفية الصورة
        widget: color
        hint: 'يظهر حول الشعار. بصيغة مثل #502985'
        required: false
