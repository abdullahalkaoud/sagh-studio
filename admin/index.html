<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>صاغ — لوحة التحكم</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d1ff33'/%3E%3Ctext x='15.5' y='23.5' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='700' font-size='21' letter-spacing='-0.5' fill='%231a1a17'%3Es%3Ctspan font-size='15' dy='-5'%3E%2A%3C/tspan%3E%3C/text%3E%3C/svg%3E" />
  <style>
    /* Arabic fields: dir="auto" (set below) makes them right-aligned; this keeps mixed text readable */
    input[type="text"], textarea { unicode-bidi: plaintext; }
  </style>
</head>
<body>
  <!-- Decap CMS reads ./config.yml; we start it by hand to point the GitHub login at this site -->
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
  <script>
    // The Worker handles GitHub login at /api/auth on this same domain (see worker.js).
    CMS.init({
      config: { backend: { base_url: location.origin, auth_endpoint: "api/auth" } },
    });
  </script>
  <script>
    // Decap renders inputs dynamically; give each one dir="auto" so Arabic text runs right-to-left.
    new MutationObserver(() => {
      document.querySelectorAll('input[type="text"]:not([dir]), textarea:not([dir])')
        .forEach((el) => el.setAttribute("dir", "auto"));
    }).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
