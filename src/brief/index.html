<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{{meta.title}}</title>
<meta name="description" content="{{meta.description}}">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d1ff33'/%3E%3Ctext x='15.5' y='23.5' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='700' font-size='21' letter-spacing='-0.5' fill='%231a1a17'%3Es%3Ctspan font-size='15' dy='-5'%3E%2A%3C/tspan%3E%3C/text%3E%3C/svg%3E">
{{=preload}}
<!--
  Sagh client brief, served at https://sagh.co/brief (Arabic) and https://sagh.co/en/brief (English), card SAG-10.
  ONE template for both languages: this file holds layout, logic and question structure; the words live in
  src/brief/ar.json and src/brief/en.json (same keys, build.js checks). build.js renders this file twice
  (dist/brief/index.html, dist/en/brief/index.html), filling {{…}} placeholders, the string table and
  the WhatsApp number (from main.js). Content source: marketing/client-brief/questionnaire.md; consent: legal/privacy/consent.md.

  Submission: on submit the page opens https://wa.me/<number>?text=<the answers>; the client presses send in WhatsApp.
  Optional: if src/brief/config.json has a sheet endpoint (Google Apps Script web app, see
  marketing/client-brief/sheets-integration/), the same answers are also POSTed there, fire-and-forget;
  WhatsApp never waits for it.
  Test/screenshot hooks (URL hash):  #step=0..6  &demo=1 (fictional client)  &svc=app,identity  &err=1  &still=1
  Query: ?ref=<source>  (added to the message, e.g. ?ref=ig)
-->
<style>
@font-face { font-family: "Bricolage Grotesque"; src: url("/fonts/bricolage-grotesque.woff2") format("woff2"); font-weight: 200 800; font-stretch: 75% 100%; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url("/fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }
@font-face { font-family: "Alexandria"; src: url("/fonts/alexandria.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "IBM Plex Sans Arabic"; src: url("/fonts/ibm-plex-sans-arabic-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "IBM Plex Sans Arabic"; src: url("/fonts/ibm-plex-sans-arabic-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "IBM Plex Sans Arabic"; src: url("/fonts/ibm-plex-sans-arabic-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "IBM Plex Sans Arabic"; src: url("/fonts/ibm-plex-sans-arabic-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }

:root {
  --bg: #ffffff; --bg-2: #f4f2ee; --surface: #ffffff;
  --line: rgba(26, 26, 23, 0.12); --line-strong: rgba(26, 26, 23, 0.22);
  --text: #1a1a17; --muted: rgba(26, 26, 23, 0.6);
  --accent: #d1ff33; --accent-deep: #a6c41a; --accent-mid: #bfe02a; --accent-ink: #1a1a17; --accent-text: #4f6200;
  --panel: #1a1a17; --on-panel: #f2efe6; --on-panel-muted: rgba(242, 239, 230, 0.7);
  --panel-line: rgba(255, 255, 255, 0.08);
  --canvas-dot: rgba(26, 26, 23, 0.13); --canvas-mark: rgba(26, 26, 23, 0.18);
  /* not in tokens.json: error text on white (6.6:1). Proposed addition, see report. */
  --error: #b42318;
  --font-ar: "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-ar-display: "Alexandria", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-latin: "Bricolage Grotesque", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --font-body: var(--font-ar); --font-display: var(--font-ar-display);   /* Latin under lang="en" (end of this sheet) */
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --nav-h: 64px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 16px/1.7 var(--font-body);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
h1, h2, h3, p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.ltr { direction: ltr; unicode-bidi: isolate; }

/* ---------- top bar: brand + progress ---------- */
.top {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255, 255, 255, 0.86);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top__row {
  max-width: 760px; margin-inline: auto; padding: 0 20px;
  height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-tile {
  display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
  background: var(--accent); box-shadow: 0 3px 0 var(--accent-deep); flex: none;
}
.logo-tile svg { width: 64%; fill: none; stroke: var(--accent-ink); stroke-width: 2.6; stroke-linejoin: round; }
.brand__name { font: 700 19px/1 var(--font-latin); letter-spacing: 0.02em; direction: ltr; unicode-bidi: isolate; }
.top__count { font: 500 12.5px/1 var(--font-mono); letter-spacing: 0.1em; color: var(--muted); direction: ltr; unicode-bidi: isolate; }

.progress { max-width: 760px; margin-inline: auto; padding: 0 20px 12px; }
.progress ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.progress li { min-width: 0; }
.progress b { display: block; height: 6px; border-radius: 999px; background: var(--line); transition: background-color 0.3s var(--ease); }
.progress span {
  display: block; margin-top: 6px; font-size: 11.5px; line-height: 1.35; color: var(--muted);
  text-align: center; overflow-wrap: anywhere;
}
.progress li.is-done b { background: var(--text); }
.progress li.is-done span { color: var(--text); }
.progress li.is-current b { background: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-deep); }
.progress li.is-current span { color: var(--text); font-weight: 700; }
@media (min-width: 560px) { .progress span { font-size: 13px; } }

/* ---------- page frame ---------- */
main { max-width: 760px; margin-inline: auto; padding: 28px 20px 0; }
.sheet { position: relative; }
@media (min-width: 900px) {
  body { background: var(--bg-2); }
  main { padding-top: 40px; padding-bottom: 64px; }
  .sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 28px; padding: 48px 56px 0; }
}

/* ---------- type ---------- */
.eyebrow { font: 500 15px/1.7 var(--font-body); color: var(--accent-text); }
.eyebrow .num { font: 500 12.5px/1 var(--font-mono); letter-spacing: 0.1em; padding-right: 8px; direction: ltr; unicode-bidi: isolate; }
.title {
  margin-top: 6px; font: 700 clamp(30px, 7.6vw, 44px)/1.35 var(--font-display);
}
.title em, .hl {
  font-style: normal; color: var(--text);
  background-image: linear-gradient(var(--accent), var(--accent));
  background-repeat: no-repeat; background-size: 100% 0.42em; background-position: 0 82%;
  padding-inline: 0.12em; -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.lead { margin-top: 10px; font-size: 17px; color: var(--muted); }
.small { font-size: 13px; color: var(--muted); }

/* ---------- intro ---------- */
.intro { padding-bottom: 32px; }
.intro__title { font: 700 clamp(32px, 8.4vw, 54px)/1.35 var(--font-display); margin-top: 8px; }
.intro__body { margin-top: 14px; font-size: 17px; color: var(--muted); }
.intro__body p + p { margin-top: 2px; }
.intro__cta { margin-top: 26px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.intro__cta .btn { min-width: 168px; }

/* canvas window motif */
.comp {
  direction: ltr; margin: 28px 0 0; border: 1px solid var(--line); border-radius: 20px; background: #fff;
  box-shadow: 0 24px 50px -24px rgba(26, 26, 23, 0.28); overflow: hidden;
}
.comp__bar {
  display: flex; align-items: center; gap: 5px; padding: 9px 12px;
  border-bottom: 1px solid rgba(26, 26, 23, 0.08); font: 500 10px var(--font-mono); color: var(--muted);
}
.comp__bar i { width: 7px; height: 7px; border-radius: 50%; background: var(--canvas-mark); }
.comp__file { margin-inline-start: 8px; }
.comp__zoom { margin-inline-start: auto; }
.comp__area {
  position: relative; height: 176px;
  background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1.2px); background-size: 14px 14px;
  display: grid; place-items: center;
}
.comp__chips { direction: rtl; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 290px; position: relative; }
.comp__chips span {
  padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: #fff;
  font: 500 13px/1.4 var(--font-body); white-space: nowrap;
}
.comp__chips span.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 3px 0 var(--accent-deep); }
.comp__sel { position: absolute; inset: -8px; border: 1.5px solid var(--text); pointer-events: none; }
.comp__sel i { position: absolute; width: 7px; height: 7px; background: #fff; border: 1.5px solid var(--text); }
.comp__sel i:nth-child(1) { top: -4px; left: -4px; } .comp__sel i:nth-child(2) { top: -4px; right: -4px; }
.comp__sel i:nth-child(3) { bottom: -4px; left: -4px; } .comp__sel i:nth-child(4) { bottom: -4px; right: -4px; }
.comp__chips .comp__tag {
  direction: ltr; border: 0; white-space: nowrap;
  position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
  padding: 1px 6px; border-radius: 5px; background: var(--text); color: var(--accent); font: 500 9.5px/1.5 var(--font-mono);
}
.cur { position: absolute; display: flex; align-items: flex-start; gap: 2px; bottom: 22px; right: 18%; }
.cur svg { width: 18px; fill: var(--text); stroke: #fff; stroke-width: 1.4; stroke-linejoin: round; }
.cur span { margin-top: 14px; padding: 1px 7px; border-radius: 6px 6px 6px 2px; background: var(--accent); color: var(--accent-ink); font: 600 10.5px/1.5 var(--font-mono); }

/* ---------- buttons (raised lip) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 24px; border: 0; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); font: 700 16px/1 var(--font-body);
  white-space: nowrap; cursor: pointer; text-decoration: none;
  box-shadow: 0 4px 0 var(--accent-deep);
  transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--accent-deep); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
.btn svg { width: 18px; height: 18px; }
.btn .arrow { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.btn .chat { fill: var(--accent-ink); }
.btn--ghost {
  background: var(--surface); color: var(--text); box-shadow: none; border: 1px solid var(--line-strong); font-weight: 600;
}
.btn--ghost:hover { box-shadow: none; transform: none; border-color: var(--text); }
.btn--ghost:active { transform: translateY(1px); box-shadow: none; }

/* ---------- steps & questions ---------- */
.step__head { margin-bottom: 8px; }
.step__note {
  margin-top: 16px; padding: 12px 16px; border-radius: 20px; background: var(--bg-2); font-size: 15px;
}
.optional-hint { margin-top: 8px; }
.q { margin: 30px 0 0; padding: 0; border: 0; min-width: 0; }
.q__label { display: block; padding: 0; font: 600 18px/1.55 var(--font-body); }
.req { display: inline-block; margin-inline-start: 8px; font: 500 12.5px/1 var(--font-body); color: var(--accent-text); vertical-align: 2px; }
.q__help { margin-top: 2px; font-size: 14px; color: var(--muted); }
.q__body { margin-top: 12px; }
.svc-head { margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.svc-head.is-first { border-top: 0; padding-top: 0; margin-top: 26px; }
.svc-head + .svc > .q:first-child { margin-top: 14px; }
.svc-head h3 { font: 700 21px/1.4 var(--font-display); }
.svc-head .logo-tile { width: 26px; height: 26px; border-radius: 8px; }
.svc-head .num { font: 500 12px/1 var(--font-mono); color: var(--muted); letter-spacing: 0.1em; margin-inline-start: auto; direction: ltr; unicode-bidi: isolate; }

/* choice chips: unselected = white pill; selected = lime fill with raised lip (like the site tokens/buttons) */
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chips label { position: relative; display: block; max-width: 100%; cursor: pointer; }
.chips input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.chip {
  display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 10px 18px 10px 20px;
  border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface);
  font: 500 15.5px/1.45 var(--font-body); color: var(--text);
  transition: background-color 0.18s var(--ease), border-color 0.18s, box-shadow 0.18s var(--ease), transform 0.18s var(--ease);
}
.chip__mark {
  flex: none; width: 20px; height: 20px; display: grid; place-items: center;
  border: 1.5px solid var(--line-strong); background: #fff;
}
.chip__mark svg { width: 13px; height: 13px; fill: none; stroke: var(--accent-ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.chips--single .chip__mark { border-radius: 50%; }
.chips--multi .chip__mark { border-radius: 6px; }
.chips label:hover .chip { border-color: var(--text); }
.chips input:checked + .chip {
  background: var(--accent); border-color: var(--accent); box-shadow: 0 3px 0 var(--accent-deep); font-weight: 600;
}
.chips input:checked + .chip .chip__mark { border-color: var(--accent-ink); }
.chips input:checked + .chip .chip__mark svg { opacity: 1; }
.chips input:active + .chip { transform: translateY(2px); }
.chips input:focus-visible + .chip { outline: 2px solid var(--accent-text); outline-offset: 3px; }
.chip__en { font: 400 13px/1 var(--font-latin); color: var(--muted); }

/* fields */
.field {
  width: 100%; min-height: 54px; padding: 0 22px; border: 1px solid var(--line-strong); border-radius: 999px;
  background: var(--surface); font: 400 16px/1.5 var(--font-body); color: var(--text);
  transition: border-color 0.18s, box-shadow 0.18s;
}
textarea.field { min-height: 116px; padding: 14px 20px; border-radius: 20px; resize: vertical; line-height: 1.7; }
.field::placeholder { color: rgba(26, 26, 23, 0.42); }
.field:hover { border-color: rgba(26, 26, 23, 0.4); }
.field:focus { outline: none; border-color: var(--text); box-shadow: 0 0 0 3px var(--accent); }
.field[type="date"] { max-width: 240px; font-family: var(--font-mono); font-size: 15px; direction: ltr; text-align: right; }
.field[type="email"], .field[type="url"] { direction: ltr; text-align: right; }
.field[type="email"]::placeholder { text-align: right; }
.counter { margin-top: 6px; font: 500 12px/1 var(--font-mono); color: var(--muted); direction: ltr; text-align: left; }
.phone { display: flex; gap: 8px; direction: ltr; }
.phone .field { text-align: left; font-family: var(--font-mono); font-size: 15.5px; letter-spacing: 0.02em; }
.phone .field--cc { flex: 0 0 96px; padding: 0 14px; text-align: center; }
.phone .field--num { flex: 1; min-width: 0; }

.consent {
  margin-top: 28px; padding: 18px; border: 1px solid var(--line); border-radius: 28px; background: var(--bg-2);
}
.consent label { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.consent input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.consent .chip__mark { margin-top: 3px; width: 24px; height: 24px; border-radius: 7px; border-color: rgba(26, 26, 23, 0.4); }
.consent .chip__mark svg { width: 15px; height: 15px; }
.consent input:checked + .chip__mark { background: var(--accent); border-color: var(--accent-ink); box-shadow: 0 2px 0 var(--accent-deep); }
.consent input:checked + .chip__mark svg { opacity: 1; }
.consent input:focus-visible + .chip__mark { outline: 2px solid var(--accent-text); outline-offset: 3px; }
.consent__text { font-size: 15px; line-height: 1.8; }
.consent__more { display: inline-block; margin-top: 8px; margin-inline-start: 36px; font-size: 13.5px; color: var(--accent-text); text-underline-offset: 4px; }

.err {
  display: flex; align-items: center; gap: 6px; margin-top: 10px;
  font-size: 14px; font-weight: 500; color: var(--error);
}
.err svg { width: 16px; height: 16px; flex: none; fill: var(--error); }
.q.has-err .field, .q.has-err .chip { border-color: var(--error); }
.q.has-err .chips input:checked + .chip { border-color: var(--accent); }
.consent.has-err { border-color: var(--error); }

/* ---------- action bar ---------- */
.actions {
  position: sticky; bottom: 0; z-index: 20;
  margin: 36px -20px 0; padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
  display: flex; gap: 10px; align-items: center;
  background: rgba(255, 255, 255, 0.92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
.actions .btn--next { flex: 1; }
.actions .btn--back { flex: 0 0 auto; padding: 0 20px; }
@media (min-width: 900px) {
  .actions { position: static; margin: 40px -56px 0; padding: 22px 56px 26px; border-radius: 0 0 28px 28px; background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .actions .btn--next { flex: 0 0 auto; min-width: 200px; margin-inline-start: auto; }
}

/* ---------- thank-you ---------- */
.done { padding-bottom: 40px; }
.thanks {
  position: relative; overflow: hidden; isolation: isolate;
  margin: 0 -8px; padding: 40px 24px 34px; border-radius: 28px; background: var(--panel); color: var(--on-panel);
}
.thanks::before {
  content: ""; position: absolute; left: 50%; top: -220px; width: 620px; height: 480px; transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(209, 255, 51, 0.22), transparent); z-index: -1;
}
.thanks .logo-tile { width: 44px; height: 44px; border-radius: 12px; }
.thanks h2 { margin-top: 20px; font: 700 clamp(28px, 7vw, 40px)/1.35 var(--font-display); }
.thanks h2 em { font-style: normal; color: var(--accent); }
.thanks__next { margin-top: 22px; font: 600 16px/1.6 var(--font-body); color: var(--on-panel); }
.thanks ol { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 12px; }
.thanks li { display: flex; gap: 12px; align-items: flex-start; font-size: 15.5px; line-height: 1.7; color: var(--on-panel-muted); }
.thanks li b {
  flex: none; display: grid; place-items: center; width: 28px; height: 28px; margin-top: 1px; border-radius: 9px;
  background: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 0 var(--accent-deep); font: 700 13px/1 var(--font-mono);
}
.thanks__cap { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--panel-line); font-size: 14.5px; color: var(--on-panel-muted); }
.thanks .btn { margin-top: 24px; width: 100%; }
@media (min-width: 560px) { .thanks { margin: 0; padding: 48px 40px 40px; border-radius: 40px; } .thanks .btn { width: auto; } }

.thanks__ref { margin-top: 10px; font-size: 14.5px; color: var(--on-panel-muted); }
.thanks__ref b { font: 600 14px/1 var(--font-mono); letter-spacing: 0.06em; color: var(--accent); direction: ltr; unicode-bidi: isolate; }

/* fallback when WhatsApp did not open */
.fallback { margin-top: 20px; padding: 20px; border: 1px dashed rgba(26, 26, 23, 0.35); border-radius: 28px; background: var(--surface); }
.fallback__title { font: 600 16px/1.6 var(--font-body); }
.fallback__text { margin-top: 4px; font-size: 14px; color: var(--muted); }
.fallback__tools { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; margin-top: 16px; }
.fallback__tools .btn { min-height: 46px; font-size: 15px; }
.textlink { font-size: 15px; font-weight: 600; color: var(--text); text-decoration: underline; text-decoration-color: var(--accent-deep); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.textlink:hover { text-decoration-color: var(--text); }
.copied { flex-basis: 100%; font-size: 13.5px; color: var(--accent-text); font-weight: 600; }
.copied:empty { display: none; }
.wa-num { direction: ltr; unicode-bidi: isolate; font-family: var(--font-mono); font-size: 13.5px; }

/* screen transitions */
.screen { animation: rise 0.45s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.no-anim .screen { animation: none; }

/* ---------- header end: step count + language pill (same look as the site's .nav__lang) ---------- */
.top__end { display: flex; align-items: center; gap: 14px; }
.lang-pill {
  display: inline-grid; place-items: center; min-width: 40px; height: 34px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: 999px; text-decoration: none; color: var(--text);
  font: 700 13px/1 var(--font-latin); transition: border-color 0.2s, background-color 0.2s;
}
.lang-pill:lang(ar) { font: 700 15px/1 var(--font-ar); }
.lang-pill:hover { border-color: var(--text); background: var(--surface); }
.under { margin: 14px 0 24px; font-size: 13px; line-height: 1.7; color: var(--muted); }
/* spam trap: off screen, not focusable, ignored by people and assistive tech */
.hp { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); visibility: hidden; }   /* no left:-10000px: in RTL that adds a horizontal scroll */

/* ---------- English page (lang="en", LTR): Latin faces, uppercase mono eyebrows and labels ---------- */
html[lang="en"] { --font-body: var(--font-latin); --font-display: var(--font-latin); }
html[lang="en"] body { line-height: 1.6; }
html[lang="en"] .eyebrow { font: 500 12.5px/1.7 var(--font-mono); letter-spacing: 0.22em; text-transform: uppercase; }
html[lang="en"] .eyebrow .num { padding-right: 0; padding-left: 10px; }
html[lang="en"] .title { line-height: 1.12; letter-spacing: -0.015em; }
html[lang="en"] .intro__title { line-height: 1.1; letter-spacing: -0.02em; }
html[lang="en"] .thanks h2 { line-height: 1.15; letter-spacing: -0.015em; }
html[lang="en"] .svc-head h3 { line-height: 1.25; }
html[lang="en"] .q__label { line-height: 1.4; }
html[lang="en"] .req { font: 500 10.5px/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; vertical-align: 3px; }
html[lang="en"] .chip { padding: 10px 20px 10px 18px; }
html[lang="en"] .comp__chips { direction: ltr; }
html[lang="en"] .field[type="date"], html[lang="en"] .field[type="email"], html[lang="en"] .field[type="url"],
html[lang="en"] .field[type="email"]::placeholder { text-align: left; }
html[lang="en"] .counter { text-align: right; }
html[lang="en"] .cur { right: auto; left: 18%; }
html[lang="en"] .btn { font-weight: 600; }
</style>
</head>
<body>

<header class="top">
  <div class="top__row">
    <a class="brand" href="/" aria-label="{{meta.home_aria}}">
      <span class="logo-tile" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 5l10 5.5v11L16 27 6 21.5v-11z M6 10.5l10 5.5 10-5.5M16 16v11"/></svg></span>
      <span class="brand__name">sagh*</span>
    </a>
    <div class="top__end">
      <span class="top__count" id="count" aria-hidden="true"></span>
      <a class="lang-pill" id="lang-switch" href="{{meta.alt_href}}" hreflang="{{meta.alt_lang}}" lang="{{meta.alt_lang}}" aria-label="{{meta.switch_aria}}">{{meta.switch_text}}</a>
    </div>
  </div>
  <nav class="progress" id="progress" aria-label="{{meta.progress_aria}}" hidden><ol></ol></nav>
</header>

<main>
  <form class="sheet" id="form" novalidate autocomplete="on"></form>
</main>

<script>
(function () {
"use strict";

/* ===================== settings (shared by both languages) ===================== */
var WA_NUMBER = "__WHATSAPP_NUMBER__";   // filled by build.js from WHATSAPP_NUMBER in main.js
var WA_MAX_CHARS = 3500;                 // keep the pre-filled WhatsApp text under this (long free text is trimmed with "…")
var WA_HEADER = "طلب مشروع جديد — صاغ / New project brief — Sagh";   // fixed first line of every message, both languages
var CONSENT_VERSION;      // version of the consent text (legal/privacy/consent.md); change when the text changes

/* Google Sheet copy of each brief (optional). Do NOT edit here: set both values in src/brief/config.json
   (build.js fills them in; empty = off). SHEET_ENDPOINT is the Apps Script web app URL ending in /exec,
   SHEET_TOKEN equals BRIEF_TOKEN in the script's Script Properties. The token is visible in the page source:
   it only stops random spam, it is not a secret. Setup: marketing/client-brief/sheets-integration/SETUP.md. */
var SHEET_ENDPOINT = "__SHEET_ENDPOINT__";
CONSENT_VERSION = SHEET_ENDPOINT ? "2026-11-18" : "2026-11-17";  // v0.2 (sheet on) / v0.1 (sheet off)
var SHEET_TOKEN = "__SHEET_TOKEN__";
var SHEET_MAX_FIELD = 2000;              // each answer sent to the sheet is cut to this many characters

/* ===================== words: src/brief/<lang>.json, injected by build.js ===================== */
var T = /*__STRINGS__*/{};
var LANG = document.documentElement.lang;

/* ===================== question structure (labels come from T.q) ===================== */
var Q = {
  services: { type:"multi", req:true, help:"multi", opts:["identity","website","store","app","uiux","social","other"] },
  id_name: { type:"single", req:true, opts:["final","draft","naming","none"] },
  id_deliverables: { type:"multi", req:true, help:"multi", opts:["logo","system","stationery","social_kit","packaging","profile","unsure"] },
  web_pages: { type:"single", req:true, opts:["one","upto5","6to10","10plus","unsure"] },
  web_languages: { type:"single", req:true, opts:["ar","en","both"] },
  web_features: { type:"multi", req:false, help:"multi", exclusive:"none", opts:["cms","form","blog","sell","none"] },
  store_platform: { type:"single", req:true, opts:["salla","zid","shopify","custom","existing","unsure"] },
  store_products: { type:"single", req:true, opts:["lt20","20to100","100to500","500plus"] },
  app_platforms: { type:"single", req:true, opts:["both","ios","android","unsure"] },
  app_screens: { type:"single", req:true, opts:["lt10","10to20","20to40","40plus","unsure"] },
  app_features: { type:"multi", req:true, help:"multi", exclusive:"none", opts:["login","payments","admin","backend","notifications","maps","none"] },
  ux_for: { type:"single", req:true, opts:["app","web","internal"] },
  ux_screens: { type:"single", req:true, opts:["lt10","10to20","20to40","40plus","unsure"], show:function(a){ return !has(a.services,"app"); } },
  ux_existing: { type:"single", req:true, opts:["new","live","building"] },
  social_posts: { type:"single", req:true, opts:["lt8","8to15","16to30","once"] },
  social_platforms: { type:"multi", req:false, help:"multi", opts:["instagram","tiktok","x","snapchat","linkedin"] },
  other_desc: { type:"textarea", req:true },
  stage: { type:"single", req:true, opts:["idea","starting","live_refresh","live_add"] },
  goal: { type:"textarea", req:true, max:500 },
  audience: { type:"text", req:false },
  references: { type:"textarea", req:false, links:true },
  ready: { type:"multi", req:true, help:"multi", exclusive:"nothing", opts:["logo","text","photos","ui_design","domain","nothing"] },
  budget: { type:"single", req:true, opts:["lt3","3to7","7to15","15to30","30to50","50plus","unsure"] },
  timeline: { type:"single", req:true, opts:["asap","1m","1to3m","flex"] },
  deadline: { type:"date", req:false, show:function(a){ return !!a.timeline && a.timeline !== "flex"; } },
  decision: { type:"single", req:true, opts:["me","me_partner","other"] },
  source: { type:"single", req:false, opts:["referral","instagram","tiktok","x","google","site","other"] },
  name: { type:"text", req:true, auto:"name" },
  project_name: { type:"text", req:false, auto:"organization" },
  phone: { type:"phone", req:true },
  email: { type:"email", req:false, auto:"email" },
  city: { type:"text", req:false, auto:"address-level2" },
  consent: { type:"consent", req:true }
};
/* attach the words: label, help, placeholder and [value, label] option pairs */
Object.keys(Q).forEach(function (id) {
  var q = Q[id], w = id === "consent" ? { label: (SHEET_ENDPOINT ? T.consent : T.consent_nosheet) } : (T.q[id] || {});
  q.label = w.label || id;
  if (q.help === "multi") q.help = T.ui.multi_help;
  if (w.help) q.help = w.help;
  if (w.ph) q.ph = w.ph;
  if (q.opts) q.opts = q.opts.map(function (v) { return [v, (w.opts && w.opts[v]) || v]; });
});
function svcName(v) { return T.q.services.opts[v] || v; }

var BRANCHES = [
  ["identity", ["id_name","id_deliverables"]],
  ["website", ["web_pages","web_languages","web_features"]],
  ["store", ["store_platform","store_products"]],
  ["app", ["app_platforms","app_screens","app_features"]],
  ["uiux", ["ux_for","ux_screens","ux_existing"]],
  ["social", ["social_posts","social_platforms"]],
  ["other", ["other_desc"]]
];
var STEP_QS = [["services"], null, ["stage","goal","audience","references","ready"], ["budget","timeline","deadline","decision","source"], ["name","project_name","phone","email","city","consent"]];
var MSG = T.msg;

/* ===================== state ===================== */
var A = { phone_cc: "+966" };
var step = 0;            // 0 intro, 1..5 steps, 6 thank-you
var submittedAt = null;
var briefRef = "";       // SB-YYMMDD-xxx, made on submit
var waUrl = "";
var sheetUsed = !!SHEET_ENDPOINT;
var form = document.getElementById("form");
var params = parseHash();
var ref = (new URLSearchParams(location.search)).get("ref") || "";

function has(arr, v) { return Array.isArray(arr) && arr.indexOf(v) !== -1; }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function parseHash() {
  var o = {}; (location.hash || "").replace(/^#/, "").split("&").forEach(function (kv) {
    if (!kv) return; var p = kv.split("="); o[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || "");
  }); return o;
}

/* which questions are visible on a step, given the current answers */
function visible(id) { return !Q[id].show || Q[id].show(A); }
function stepQuestions(s) {
  if (s === 2) {
    var out = [];
    BRANCHES.forEach(function (b) { if (has(A.services, b[0])) b[1].forEach(function (id) { if (visible(id)) out.push(id); }); });
    return out;
  }
  return (STEP_QS[s - 1] || []).filter(visible);
}

/* ===================== icons (arrows follow the reading direction) ===================== */
var RTL = document.documentElement.dir === "rtl";
var ARROW_L = '<svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
var ARROW_R = '<svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
var ICON_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';
var ICON_CUBE = '<svg viewBox="0 0 32 32"><path d="M16 5l10 5.5v11L16 27 6 21.5v-11z M6 10.5l10 5.5 10-5.5M16 16v11"/></svg>';
var ICON_ERR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1 5h2v7h-2zm0 9h2v2h-2z"/></svg>';
var ICON_NEXT = RTL ? ARROW_L : ARROW_R;
var ICON_BACK = RTL ? ARROW_R : ARROW_L;

/* ===================== rendering ===================== */
function reqTag(q) { return q.req ? '<span class="req">' + esc(T.ui.req) + "</span>" : ""; }
function helpHtml(id, q) { return q.help ? '<p class="q__help" id="' + id + '-help">' + esc(q.help) + "</p>" : ""; }
function pad2(n) { return String(n).padStart(2, "0"); }

function renderQ(id) {
  var q = Q[id], h = "", desc = (q.help ? id + "-help " : "") + id + "-err";
  var hidden = q.show && !q.show(A) ? " hidden" : "";
  if (q.type === "single" || q.type === "multi") {
    var t = q.type === "single" ? "radio" : "checkbox";
    h += '<fieldset class="q" data-q="' + id + '"' + hidden + ' aria-describedby="' + desc + '">';
    h += '<legend class="q__label">' + esc(q.label) + reqTag(q) + "</legend>" + helpHtml(id, q);
    h += '<div class="q__body chips chips--' + q.type + '">';
    q.opts.forEach(function (o) {
      var on = q.type === "single" ? A[id] === o[0] : has(A[id], o[0]);
      h += '<label><input type="' + t + '" name="' + id + '" value="' + o[0] + '"' + (on ? " checked" : "") + (q.req && q.type === "single" ? " aria-required=\"true\"" : "") + '>' +
           '<span class="chip"><span class="chip__mark">' + ICON_CHECK + "</span><span>" + esc(o[1]) + "</span></span></label>";
    });
    h += "</div>";
  } else if (q.type === "consent") {
    h += '<div class="q consent" data-q="' + id + '">';
    h += '<label><input type="checkbox" name="consent" id="f-consent"' + (A.consent ? " checked" : "") + ' aria-required="true" aria-describedby="consent-err">' +
         '<span class="chip__mark">' + ICON_CHECK + '</span><span class="consent__text">' + esc(q.label) + reqTag(q) + "</span></label>";
  } else {
    h += '<div class="q" data-q="' + id + '"' + hidden + ">";
    h += '<label class="q__label" for="f-' + id + '">' + esc(q.label) + reqTag(q) + "</label>" + helpHtml(id, q);
    h += '<div class="q__body">';
    var common = ' id="f-' + id + '" name="' + id + '" aria-describedby="' + desc + '"' + (q.req ? ' aria-required="true"' : "") + (q.ph ? ' placeholder="' + esc(q.ph) + '"' : "") + (q.auto ? ' autocomplete="' + q.auto + '"' : "");
    var val = esc(A[id] || "");
    if (q.type === "textarea") {
      h += '<textarea class="field"' + common + (q.max ? ' maxlength="' + q.max + '"' : "") + (q.links ? ' dir="auto" rows="3"' : ' rows="3"') + ">" + val + "</textarea>";
      if (q.max) h += '<div class="counter" id="' + id + '-count">' + (A[id] || "").length + " / " + q.max + "</div>";
    } else if (q.type === "phone") {
      h += '<div class="phone"><input class="field field--cc" type="text" inputmode="tel" id="f-phone_cc" name="phone_cc" aria-label="' + esc(T.ui.cc_aria) + '" value="' + esc(A.phone_cc || "+966") + '" maxlength="5" autocomplete="tel-country-code">' +
           '<input class="field field--num" type="tel" inputmode="tel"' + common + ' value="' + val + '" autocomplete="tel-national"></div>';
    } else if (q.type === "date") {
      h += '<input class="field" type="date"' + common + ' value="' + val + '">';
    } else {
      h += '<input class="field" type="' + (q.type === "email" ? "email" : "text") + '"' + common + ' value="' + val + '"' + (q.type === "email" ? ' inputmode="email"' : "") + ">";
    }
    h += "</div>";
  }
  h += '<p class="err" id="' + (q.type === "consent" ? "consent" : id) + '-err" role="alert" hidden></p>';
  h += q.type === "single" || q.type === "multi" ? "</fieldset>" : "</div>";
  return h;
}

function actions(nextLabel, isLast) {
  return '<div class="actions">' +
    '<button type="button" class="btn btn--ghost btn--back" data-act="back">' + ICON_BACK + "<span>" + esc(T.ui.back) + "</span></button>" +
    '<button type="' + (isLast ? "submit" : "button") + '" class="btn btn--next" data-act="next"><span>' + esc(nextLabel) + "</span>" + ICON_NEXT + "</button></div>";
}

function head(s, sub) {
  var t = T.ui.step_titles[s - 1];
  return '<div class="step__head"><p class="eyebrow">' + esc(T.ui.step) + '<span class="num">' + pad2(s) + " / 05</span></p>" +
    '<h1 class="title" tabindex="-1" id="screen-title"><em class="hl">' + esc(t[0]) + "</em>" + esc(t[1]) + "</h1>" + (sub ? '<p class="lead">' + esc(sub) + "</p>" : "") + "</div>";
}

function render() {
  var h = "", U = T.ui;
  if (step === 0) {
    var chips = U.intro_chips.map(function (c, i) { return "<span" + (i === 1 || i === 3 ? ' class="on"' : "") + ">" + esc(c) + "</span>"; }).join("");
    h = '<section class="screen intro" aria-labelledby="screen-title">' +
      '<p class="eyebrow">' + esc(U.intro_eyebrow) + "</p>" +
      '<h1 class="intro__title" id="screen-title" tabindex="-1">' + esc(U.intro_title) + '<em class="hl">' + esc(U.intro_title_hl) + "</em></h1>" +
      '<div class="intro__body">' + U.intro_body.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + "</div>" +
      '<div class="intro__cta"><button type="button" class="btn" data-act="next"><span>' + esc(U.start) + "</span>" + ICON_NEXT + "</button>" +
      '<p class="small">' + esc(SHEET_ENDPOINT ? U.intro_small_sheet : U.intro_small) + "</p></div>" +
      '<div class="comp" aria-hidden="true"><div class="comp__bar"><i></i><i></i><i></i><span class="comp__file">sagh — brief</span><span class="comp__zoom">100%</span></div>' +
      '<div class="comp__area"><div class="comp__chips">' + chips +
      '<div class="comp__sel"><i></i><i></i><i></i><i></i><span class="comp__tag">5 options</span></div></div>' +
      '<div class="cur"><svg viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.4-7.6L20.5 11z"/></svg><span>sagh</span></div></div></div>' +
      "</section>";
  } else if (step === 1) {
    h = '<section class="screen">' + head(1) + renderQ("services") + actions(U.next) + "</section>";
  } else if (step === 2) {
    var picked = BRANCHES.filter(function (b) { return has(A.services, b[0]); });
    h = '<section class="screen">' + head(2);
    if (picked.length >= 4) h += '<p class="step__note">' + esc(U.many_note) + "</p>";
    picked.forEach(function (b, i) {
      if (picked.length > 1) h += '<div class="svc-head' + (i === 0 ? " is-first" : "") + '"><span class="logo-tile" aria-hidden="true">' + ICON_CUBE + "</span><h3>" + esc(svcName(b[0])) + '</h3><span class="num">' + (i + 1) + "/" + picked.length + "</span></div>";
      h += '<div class="svc" data-svc="' + b[0] + '">' + b[1].map(renderQ).join("") + "</div>";
    });
    h += actions(U.next) + "</section>";
  } else if (step === 3 || step === 4) {
    h = '<section class="screen">' + head(step) + STEP_QS[step - 1].map(renderQ).join("") + actions(U.next) + "</section>";
  } else if (step === 5) {
    h = '<section class="screen">' + head(5, U.contact_lead) + STEP_QS[4].map(renderQ).join("") +
      // spam trap: people never see or reach it; bots that fill every field get flagged in the sheet payload
      '<div class="hp" aria-hidden="true"><label for="f-hp_extra">Leave this empty</label><input type="text" id="f-hp_extra" name="hp_extra" tabindex="-1" autocomplete="off"></div>' +
      actions(U.submit, true) + '<p class="under">' + esc(sheetUsed ? U.under_button_sheet : U.under_button) + "</p></section>";
  } else {
    h = renderThanks();
  }
  form.innerHTML = h;
  renderProgress();
}

function renderProgress() {
  var nav = document.getElementById("progress"), cnt = document.getElementById("count");
  nav.hidden = step === 0 || step === 6;
  cnt.textContent = step >= 1 && step <= 5 ? pad2(step) + " / 05" : "";
  nav.querySelector("ol").innerHTML = T.ui.step_names.map(function (n, i) {
    var s = i + 1, cls = s < step ? "is-done" : s === step ? "is-current" : "";
    return '<li class="' + cls + '"' + (s === step ? ' aria-current="step"' : "") + '><b aria-hidden="true"></b><span>' + esc(n) + (s < step ? '<span class="sr">' + esc(T.ui.done_sr) + "</span>" : "") + "</span></li>";
  }).join("");
}

/* ===================== the message (what reaches Sagh on WhatsApp) ===================== */
function labelOf(id, v, cap) {
  var q = Q[id];
  if (v == null || v === "" || (Array.isArray(v) && !v.length)) return "";
  if (q.opts) {
    var m = {}; q.opts.forEach(function (o) { m[o[0]] = o[1]; });
    return Array.isArray(v) ? v.map(function (x) { return m[x] || x; }).join(T.wa.sep) : (m[v] || v);
  }
  if (id === "consent") return v ? T.wa.agreed : "";
  return clip(String(v).trim(), cap);
}
/* trim free text to cap characters (0 = no limit), ending on a word with "…" */
function clip(t, cap) { return cap && t.length > cap ? t.slice(0, cap).replace(/\s+\S*$/, "") + "…" : t; }
function phoneFull() {
  var cc = (A.phone_cc || "+966").trim(), n = (A.phone || "").replace(/[\s-]/g, "");
  if (cc === "966") cc = "+966";
  if (cc === "+966" && /^0/.test(n)) n = n.slice(1);
  if (cc && cc.charAt(0) !== "+") cc = "+" + cc;
  return n ? cc + " " + n : "";
}
function makeRef(d) {
  var abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", r = "", buf = new Uint8Array(3);
  window.crypto.getRandomValues(buf);
  for (var i = 0; i < 3; i++) r += abc[buf[i] % abc.length];
  return "SB-" + String(d.getFullYear()).slice(2) + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "-" + r;
}
/* does a question apply to this brief (its service is picked and its condition holds)? */
function applies(id) {
  for (var i = 0; i < BRANCHES.length; i++) if (has(BRANCHES[i][1], id)) return has(A.services, BRANCHES[i][0]) && visible(id);
  return visible(id);
}
function flagsList() {
  var flags = [];
  if (has(A.services, "identity") && A.id_name === "naming") flags.push(T.wa.flag_naming);
  if (has(A.services, "website") && has(A.web_features, "sell")) flags.push(T.wa.flag_sell);
  return flags;
}
function summaryModel(cap) {
  var W = T.wa;
  function row(id, label) { return [label || Q[id].label, labelOf(id, A[id], cap)]; }
  var secs = [];
  secs.push({ t: W.contact, rows: [row("name"), row("project_name"), [W.phone, phoneFull()], row("email"), row("city")] });
  secs.push({ t: W.service, rows: [row("services")] });
  BRANCHES.forEach(function (b) {
    if (!has(A.services, b[0])) return;
    secs.push({ t: W.details + ": " + svcName(b[0]), rows: b[1].filter(visible).map(function (id) { return row(id); }) });
  });
  [[2, W.project], [3, W.budget_time]].forEach(function (x) {
    secs.push({ t: x[1], rows: STEP_QS[x[0]].filter(visible).map(function (id) { return row(id); }) });
  });
  return { secs: secs, flags: flagsList() };
}
/* plain-text summary; cap trims each free-text answer (0 = full text) */
function summaryText(cap) {
  var W = T.wa, m = summaryModel(cap || 0), L = [WA_HEADER, W.ref + ": " + (briefRef || "—")];
  if (W.lang_line) L.push(W.lang_line);
  m.flags.forEach(function (f) { L.push(W.note + ": " + f); });
  m.secs.forEach(function (s) {
    L.push("", "*" + s.t + "*");
    s.rows.forEach(function (r) { L.push("- " + r[0].replace(/[؟?.:]\s*$/, "") + ": " + (r[1] && String(r[1]).trim() ? String(r[1]).replace(/\s*\n+\s*/g, " | ") : "—")); });
  });
  L.push("", A.consent ? W.consent_line.replace("{v}", CONSENT_VERSION) : W.consent_none);
  if (ref) L.push(W.source + ": " + ref.slice(0, 40));
  return L.join("\n");
}
/* the WhatsApp text: full answers, trimming long free text step by step until it fits WA_MAX_CHARS */
function messageText() {
  var caps = [0, 600, 400, 250, 150, 80, 40], t = "";
  for (var i = 0; i < caps.length; i++) { t = summaryText(caps[i]); if (t.length <= WA_MAX_CHARS) return t; }
  return t.slice(0, WA_MAX_CHARS - 1) + "…";
}
function buildWaUrl() { return "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(messageText()); }
function openWhatsApp(url) {
  // runs inside the submit click, so browsers allow the new tab; on phones wa.me hands over to the WhatsApp app.
  try { window.open(url, "_blank", "noopener"); } catch (e) { location.href = url; }
}

/* ===================== Google Sheet copy (fire-and-forget) ===================== */
/* One JSON object per brief (field list: marketing/client-brief/sheets-integration/columns.md).
   submitted_at: client clock, ISO; source_ref: the ?ref= value; page_url: the page the brief was sent from;
   answers: readable text in the page language (one sheet column each); raw: the stable option codes, for filtering.
   Column order is set in Code.gs. */
function sheetPayload() {
  var answers = {}, raw = {};
  Object.keys(Q).forEach(function (id) {
    if (id === "consent") return;
    var on = applies(id), v = A[id];
    if (id === "phone") { answers.phone = phoneFull(); raw.phone = answers.phone; return; }
    answers[id] = on ? labelOf(id, v, SHEET_MAX_FIELD) : "";
    // raw: stable option codes only (for filtering); free text is already in answers, so it is not sent twice
    if (on && Q[id].opts && v != null && v !== "" && !(Array.isArray(v) && !v.length)) raw[id] = Array.isArray(v) ? v.join(",") : String(v);
  });
  var hp = form.querySelector('[name="hp_extra"]');
  return {
    v: 1, token: SHEET_TOKEN, hp_extra: hp ? hp.value : "",
    ref: briefRef, lang: LANG, source_ref: ref.slice(0, 40),
    page_url: (location.origin + location.pathname + location.search).slice(0, 300),   // no #hash
    submitted_at: submittedAt ? submittedAt.toISOString() : "",
    consent: !!A.consent, consent_version: CONSENT_VERSION,
    flags: flagsList().join(" | "), answers: answers, raw: raw
  };
}
function sendToSheet() {
  if (!SHEET_ENDPOINT || !window.fetch) return;
  try {
    // text/plain + no-cors = a "simple" request: no CORS preflight, the response is opaque and never awaited.
    // keepalive lets it finish even if the page is left for WhatsApp.
    fetch(SHEET_ENDPOINT, {
      method: "POST", mode: "no-cors", keepalive: true, credentials: "omit",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(sheetPayload())
    }).catch(function () {});
  } catch (e) { /* never block WhatsApp */ }
}

function renderThanks() {
  var U = T.ui, nm = (A.name || "").trim().split(/\s+/)[0] || "";
  var s = '<section class="screen done">' +
    '<div class="thanks"><span class="logo-tile" aria-hidden="true">' + ICON_CUBE + "</span>" +
    '<h2 id="screen-title" tabindex="-1">' + esc(U.thanks_title) + (nm ? " <em>" + esc(nm) + "</em>" : "") + esc(U.thanks_title_end) + "</h2>" +
    (briefRef ? '<p class="thanks__ref">' + esc(U.thanks_ref) + " <b>" + esc(briefRef) + "</b></p>" : "") +
    '<p class="thanks__next">' + esc(U.thanks_next) + "</p><ol>" +
    U.thanks_steps.map(function (t, i) { return "<li><b>" + (i + 1) + "</b><span>" + esc(t) + "</span></li>"; }).join("") + "</ol>" +
    '<p class="thanks__cap">' + esc(U.thanks_cap) + "</p></div>";
  var fbText = sheetUsed ? U.fallback_text_sheet : U.fallback_text;
  s += '<div class="fallback"><p class="fallback__title">' + esc(U.fallback_title) + "</p>" +
    '<p class="fallback__text">' + esc(U.fallback_on) + ' <span class="wa-num">+' + esc(WA_NUMBER) + "</span>." + (fbText ? " " + esc(fbText) : "") + "</p>" +
    '<div class="fallback__tools"><button type="button" class="btn" data-act="copy"><span>' + esc(U.copy) + "</span></button>" +
    '<a class="textlink" id="wa-retry" href="' + esc(waUrl || buildWaUrl()) + '" target="_blank" rel="noopener">' + esc(U.retry) + "</a>" +
    '<span class="copied" id="copied" role="status"></span></div></div></section>';
  return s;
}

/* ===================== validation ===================== */
function setErr(id, msg) {
  var el = form.querySelector('[data-q="' + id + '"]'); if (!el) return;
  var e = el.querySelector(".err");
  if (msg) { e.innerHTML = ICON_ERR + "<span>" + esc(msg) + "</span>"; e.hidden = false; el.classList.add("has-err"); }
  else { e.hidden = true; e.textContent = ""; el.classList.remove("has-err"); }
  var inp = el.querySelector(".field--num, .field, input[type=checkbox]#f-consent");
  if (inp) { if (msg) inp.setAttribute("aria-invalid", "true"); else inp.removeAttribute("aria-invalid"); }
}
function checkQ(id) {
  var q = Q[id], v = A[id];
  if (q.type === "phone") {
    var n = (v || "").replace(/[\s-]/g, ""), cc = (A.phone_cc || "").trim();
    if (!n) return MSG.phoneEmpty;
    if (!/^\+?\d{1,4}$/.test(cc) || !/^\d+$/.test(n)) return MSG.phoneBad;
    if (cc === "+966" || cc === "966") { if (!/^(05\d{8}|5\d{8})$/.test(n)) return MSG.phoneBad; }
    else if (n.length < 6 || n.length > 14) return MSG.phoneBad;
    return "";
  }
  if (q.type === "email") return v && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) ? MSG.emailBad : "";
  if (!q.req) return "";
  if (q.type === "consent") return v ? "" : MSG.consent;
  if (q.type === "single") return v ? "" : MSG.single;
  if (q.type === "multi") return v && v.length ? "" : MSG.multi;
  if (!v || !String(v).trim()) return id === "name" ? MSG.name : MSG.text;
  return "";
}
function validateStep() {
  var first = null;
  stepQuestions(step).forEach(function (id) {
    var msg = checkQ(id); setErr(id, msg);
    if (msg && !first) first = id;
  });
  if (first) {
    var el = form.querySelector('[data-q="' + first + '"]');
    el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    var f = el.querySelector("input, textarea"); if (f) f.focus({ preventScroll: true });
    return false;
  }
  return true;
}

/* ===================== events ===================== */
function readInput(t) {
  var id = t.name; if (!id) return;
  if (id === "phone_cc") { A.phone_cc = t.value; return; }
  var q = Q[id]; if (!q) return;
  if (q.type === "multi") {
    var cur = Array.isArray(A[id]) ? A[id].slice() : [];
    if (t.checked) {
      if (q.exclusive && t.value === q.exclusive) cur = [q.exclusive];
      else { cur = cur.filter(function (x) { return x !== q.exclusive; }); cur.push(t.value); }
    } else cur = cur.filter(function (x) { return x !== t.value; });
    A[id] = cur;
    // reflect exclusivity in the DOM
    form.querySelectorAll('input[name="' + id + '"]').forEach(function (i) { i.checked = has(cur, i.value); });
  } else if (q.type === "consent") A.consent = t.checked;
  else A[id] = t.value;
  if (q.max) { var c = document.getElementById(id + "-count"); if (c) c.textContent = (A[id] || "").length + " / " + q.max; }
  // in-step conditional questions (deadline)
  form.querySelectorAll("[data-q]").forEach(function (el) {
    var qq = Q[el.getAttribute("data-q")]; if (qq && qq.show) el.hidden = !qq.show(A);
  });
  // clear the message once the answer becomes valid
  var holder = form.querySelector('[data-q="' + id + '"]');
  if (holder && holder.classList.contains("has-err") && !checkQ(id)) setErr(id, "");
}
form.addEventListener("change", function (e) { readInput(e.target); });
form.addEventListener("input", function (e) { if (e.target.matches("input[type=text], input[type=tel], input[type=email], textarea, input[type=date]")) readInput(e.target); });
form.addEventListener("submit", function (e) { e.preventDefault(); go(1); });   // no form action: go(1) opens WhatsApp
form.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]"); if (!b) return;
  var act = b.getAttribute("data-act");
  if (act === "next" && b.type !== "submit") go(1);
  else if (act === "back") go(-1);
  else if (act === "copy") copySummary();
});

function go(dir) {
  if (dir > 0 && step >= 1 && step <= 5 && !validateStep()) return;
  if (dir > 0 && step === 5) {
    submittedAt = new Date();
    if (!briefRef) briefRef = makeRef(submittedAt);
    waUrl = buildWaUrl();
    sendToSheet();          // optional copy to the Google Sheet: async, errors swallowed, never awaited
    openWhatsApp(waUrl);    // the client still sends the WhatsApp message themselves
  }
  setStep(Math.max(0, Math.min(6, step + dir)));
}
function setStep(s) {
  step = s; render();
  window.scrollTo(0, 0);
  var t = document.getElementById("screen-title"); if (t && !firstPaint) t.focus({ preventScroll: true });
  firstPaint = false;
}
var firstPaint = true;

function copySummary() {
  var txt = summaryText(0), out = document.getElementById("copied");
  function ok() { out.textContent = MSG.copied; }
  function fallback() {
    var ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); ok(); } catch (err) { out.textContent = MSG.copyFail; }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
}

/* keep ?ref=… when switching language (answers are not carried over) */
(function () { var a = document.getElementById("lang-switch"); if (a && location.search) a.href = a.getAttribute("href") + location.search; })();

/* ===================== boot ===================== */
if (params.demo === "1") {
  Object.keys(DEMO).forEach(function (k) { A[k] = Array.isArray(DEMO[k]) ? DEMO[k].slice() : DEMO[k]; });
  if (!ref) ref = "wa";
}
if (params.svc) A.services = params.svc.split(",").filter(function (v) { return Q.services.opts.some(function (o) { return o[0] === v; }); });
if (params.step) {
  var s0 = parseInt(params.step, 10);
  if (s0 >= 0 && s0 <= 6) { if (s0 === 6) { submittedAt = new Date(); briefRef = makeRef(submittedAt); } step = s0; }
}

firstPaint = false;
if (params.err === "1" && step >= 1 && step <= 5) validateStep();
window.__brief = { A: function () { return A; }, step: function () { return step; }, summaryText: summaryText, messageText: messageText, stepQuestions: stepQuestions, sheetPayload: sheetPayload };
