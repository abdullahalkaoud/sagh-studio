<!doctype html>
<!--
  Privacy notice at /privacy (Arabic) and /en/privacy (English). build.js turns src/privacy/ar.md and en.md
  into {{=content}} (headings, paragraphs, lists, bold, links). The words are Legal's: the master copies are
  legal/privacy/privacy-ar.md and privacy-en.md; change them there first, then copy here.
-->
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!--GTM_HEAD-->
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="alternate" hreflang="ar" href="/privacy" />
  <link rel="alternate" hreflang="en" href="/en/privacy" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d1ff33'/%3E%3Ctext x='15.5' y='23.5' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='700' font-size='21' letter-spacing='-0.5' fill='%231a1a17'%3Es%3Ctspan font-size='15' dy='-5'%3E%2A%3C/tspan%3E%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="nav__inner">
      <a class="brand" href="{{home_href}}" aria-label="{{home_aria}}">
        <span class="brand__name">sagh*</span>
      </a>
      <nav class="nav__end" aria-label="{{sections_aria}}">
        <a class="nav__lang" href="{{alt_href}}" hreflang="{{alt_lang}}" lang="{{alt_lang}}" aria-label="{{switch_aria}}">{{switch_text}}</a>
        <a class="btn" href="{{home_href}}#contact" data-cta="privacy_contact">{{cta}}</a>
      </nav>
    </div>
  </header>

  <main class="legal">
    <article class="legal__doc">
{{=content}}
    </article>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__brand">
        <span>
          <b>sagh*</b>
          <small>© {{year}} {{rights}}</small>
        </span>
      </div>
      <nav class="footer__links" aria-label="{{privacy_label}}">
        <a href="{{home_href}}">sagh.co</a>
        <button type="button" data-cookie-settings hidden></button>
      </nav>
    </div>
  </footer>

  <script src="/consent.js" defer></script>
</body>
</html>
